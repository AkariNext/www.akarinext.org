# ビルドスクリプト（postinstall 等）を走らせてよい依存。
# pnpm 10 以降は既定で全部止まるので、必要なものだけをここに挙げる。
allowBuilds:
  "@swc/core": true
  esbuild: true
  sharp: true

# --- サプライチェーン対策（https://pnpm.io/supply-chain-security）---

# 出たてのバージョンを掴まないための待ち時間（分）。pnpm 11 の既定は 1 日。
#
# ここをもっと延ばしたくなるが、lockfile の検証にも同じ物差しが使われる。
# 長くすると、更新した直後だけ CI が落ちるという噛み合わせの悪さが出る。
# 寝かせる役目は Renovate 側（renovate.json の minimumReleaseAge = 7 日）に
# 持たせ、こちらは手で入れたときの保険として既定のまま明示しておく。
minimumReleaseAge: 1440

# 公開時刻を持たないパッケージは、既定では上の待ち時間を素通りする。
# 素通りさせず、時刻が分からないものは弾く。
minimumReleaseAgeIgnoreMissingTime: false

# 推移的な依存が git やパッケージ以外の URL を指すのを許さない。
# 既定でも true だが、外れると気づきにくいので明示しておく。
blockExoticSubdeps: true

# 来歴（provenance）が前のリリースより弱くなったパッケージで失敗させる。
# publish 用の認証情報を盗まれて出された版を掴みにくくする。
trustPolicy: no-downgrade

# 1 年（525600 分）より前に公開された版は、上の判定から外す。
#
# provenance が広まる前のパッケージには、そもそも来歴が付いていない。
# それを「弱くなった」と読むと、chokidar や undici-types のように
# 古くて広く使われているものが軒並み引っかかり、そのたびに個別の
# 除外を足すことになる。
#
# 乗っ取りは新しく公開された版で起きるので、出たての版に対する
# 判定は残る。そこが本来の狙いで、古い版は既に広く使われて
# 目にさらされている。
trustPolicyIgnoreAfter: 525600
